name: Publish to simplemavenrepo

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          server-id: smr
          server-username: SMR_USERNAME
          server-password: SMR_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish with Maven Wrapper
        run: ./mvnw -B -Prelease javadoc:jar deploy -DaltDeploymentRepository=smr::${{ vars.SMR_URL }}
        env:
          SMR_USERNAME: ${{ secrets.SMR_USERNAME }}
          SMR_TOKEN: ${{ secrets.SMR_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
